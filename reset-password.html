<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password | Ghana Trotro Transit</title>
<link rel="shortcut icon" href="logo.png" type="image/x-icon">
<style>
    body {
        margin: 0;
        background: #f8f5fc;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        background: #ffffff;
        width: 100%;
        max-width: 420px;
        padding: 40px 32px;
        border-radius: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .logo {
        text-align: center;
        margin-bottom: 24px;
    }

    .logo img {
        width: 56px;
        height: 56px;
        border-radius: 50%;
    }

    h2 {
        text-align: center;
        color: #5b1ba8;
        margin: 0 0 8px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.3px;
    }

    h5 {
        text-align: center;
        color: #6b4f8a;
        margin: 0 0 28px;
        font-size: 14px;
        font-weight: 400;
    }

    label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
        color: #4a0f6f;
        font-size: 14px;
    }

    input {
        width: 100%;
        padding: 12px;
        margin-bottom: 18px;
        border: 1px solid #e8dff5;
        border-radius: 8px;
        outline: none;
        font-size: 15px;
        box-sizing: border-box;
        transition: border-color 0.2s;
    }

    input:focus {
        border-color: #5b1ba8;
    }

    button {
        width: 100%;
        background: #5b1ba8;
        color: #ffffff;
        padding: 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        transition: background 0.2s;
    }

    button:hover {
        background: #4a148c;
    }

    button:disabled {
        background: #a89bb8;
        cursor: not-allowed;
    }

    .message {
        margin-top: 16px;
        padding: 12px;
        border-radius: 8px;
        display: none;
        text-align: center;
        font-size: 14px;
    }

    .success {
        background: #f0e6ff;
        color: #4a148c;
    }

    .error {
        background: #ffe2e8;
        color: #b1153c;
    }

    .footer {
        text-align: center;
        margin-top: 24px;
        font-size: 12px;
        color: #a89bb8;
    }

    @media screen and (max-width: 480px) {
        .container {
            padding: 32px 24px;
        }
    }
</style>
</head>
<body>
<div class="container">
    <div class="logo">
        <img src="logo.png" alt="Ghana Trotro Transit">
    </div>

    <h2>Reset Password</h2>
    <h5>Create a new password for your account</h5>

    <label for="password">New Password</label>
    <input type="password" id="password" placeholder="Enter new password" />

    <label for="confirmPassword">Confirm Password</label>
    <input type="password" id="confirmPassword" placeholder="Re-enter new password" />

    <button id="resetBtn">Update Password</button>

    <div id="msg" class="message"></div>

    <div class="footer">
        © <span id="year"></span> | Ghana Trotro Transit
    </div>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
  "https://vtmdateqrrrkqbpeedrx.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0bWRhdGVxcnJya3FicGVlZHJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjEyNjAwMTAsImV4cCI6MjA3NjgzNjAxMH0.5ydzJnACZrldXIMf3LAOJVsmb6BFEers1nJTv_QorrU"
);

const urlParams = new URLSearchParams(window.location.search);
const token_hash = urlParams.get('token_hash');
const type = urlParams.get('type');

const msgBox = document.getElementById("msg");
const btn = document.getElementById("resetBtn");

// Auto year
document.getElementById('year').textContent = new Date().getFullYear();

if (type !== 'recovery' || !token_hash) {
  showMessage("Invalid or expired password reset link. Please request a new one.", "error");
  btn.disabled = true;
}

btn.addEventListener("click", async () => {
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirmPassword").value;

  if (!password || !confirm) return showMessage("Please fill in all fields.", "error");
  if (password.length < 6) return showMessage("Password must be at least 6 characters.", "error");
  if (password !== confirm) return showMessage("Passwords do not match.", "error");
  if (!token_hash) return showMessage("Invalid or missing token.", "error");

  try {
    const { error: verifyError } = await supabase.auth.verifyOtp({
      token_hash,
      type: 'recovery'
    });

    if (verifyError) throw verifyError;

    const { error: updateError } = await supabase.auth.updateUser({
      password: password
    });

    if (updateError) throw updateError;

    showMessage("Password updated successfully! You can now sign in with your new password.", "success");
    btn.disabled = true;
    
    setTimeout(() => {
      window.location.href = 'ghanatrotro://reset-success';
    }, 3000);

  } catch (error) {
    console.error('Password reset error:', error);
    showMessage(error.message || "Failed to reset password. The link may have expired.", "error");
  }
});

function showMessage(text, type) {
  msgBox.innerHTML = text;
  msgBox.className = "message " + type;
  msgBox.style.display = "block";
}
</script>
</body>
</html>
