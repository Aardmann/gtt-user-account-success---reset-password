<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account Created | Ghana Trotro Transit</title>
<link rel="shortcut icon" href="https://ghana-trotro-transit.netlify.app/icon.png" type="image/x-icon">
<style>
    body {
        margin: 0;
        background: #f8f5fc;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        padding: 40px 32px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .logo {
        margin-bottom: 24px;
    }

    .logo img {
        width: 56px;
        height: 56px;
        border-radius: 50%;
    }

    h2 {
        color: #5b1ba8;
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.3px;
    }

    p {
        color: #6b4f8a;
        margin: 0 0 16px;
        font-size: 15px;
        line-height: 1.6;
    }

    .subtitle {
        color: #8a7a9e;
        font-size: 14px;
        margin-top: 8px;
    }

    button {
        width: 100%;
        background: #5b1ba8;
        color: #ffffff;
        border: none;
        padding: 14px;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 8px;
    }

    button:hover {
        background: #4a148c;
    }

    .footer {
        margin-top: 32px;
        font-size: 12px;
        color: #a89bb8;
    }

    @media screen and (max-width: 480px) {
        .container {
            padding: 32px 24px;
        }
    }
</style>
</head>
<body>
<div class="container">
    <div class="logo">
        <img src="https://ghana-trotro-transit.netlify.app/icon.png" alt="Ghana Trotro Transit">
    </div>

    <h2>Account Created!</h2>

    <p>Your account has been successfully created.<br>You can now open the app to continue.</p>
    <p class="subtitle">Find trotro routes across Ghana with ease.</p>

    <div class="footer">
        © <span id="year"></span> | Ghana Trotro Transit
    </div>
</div>

<script>
    document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
