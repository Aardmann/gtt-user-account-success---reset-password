<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Account Created | Ghana Trotro Transit</title>
<link rel="shortcut icon" href="logo.png" type="image/x-icon">
<style>
    body {
        margin: 0;
        background: #f8f5fc;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 420px;
        background: #ffffff;
        padding: 40px 32px;
        border-radius: 12px;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    .logo {
        margin-bottom: 24px;
    }

    .logo img {
        width: 56px;
        height: 56px;
        border-radius: 50%;
    }

    h2 {
        color: #5b1ba8;
        margin: 0 0 12px;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.3px;
    }

    p {
        color: #6b4f8a;
        margin: 0 0 16px;
        font-size: 15px;
        line-height: 1.6;
    }

    .subtitle {
        color: #8a7a9e;
        font-size: 14px;
        margin-top: 8px;
    }

    button {
        width: 100%;
        background: #5b1ba8;
        color: #ffffff;
        border: none;
        padding: 14px;
        border-radius: 32px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        margin-top: 8px;
    }

    button:hover {
        background: #4a148c;
    }

    .footer {
        margin-top: 32px;
        font-size: 12px;
        color: #a89bb8;
    }

    .status-text {
        color: #8a7a9e;
        font-size: 13px;
        margin: 16px 0 0;
        min-height: 18px;
    }

    @media screen and (max-width: 480px) {
        .container {
            padding: 32px 24px;
        }
    }
</style>
</head>
<body>
<div class="container">
    <div class="logo">
        <img src="logo.png" alt="Ghana Trotro Transit">
    </div>

    <h2>Account Created!</h2>

    <p>Your account has been successfully created.<br>You can now open the app to continue.</p>
    <p class="subtitle">Find trotro routes across Ghana with ease.</p>

    <button id="continue-btn" type="button">Open App</button>
    <p class="status-text" id="status-text"></p>

    <div class="footer">
        © <span id="year"></span> | Ghana Trotro Transit
    </div>
</div>

<script>
    document.getElementById('year').textContent = new Date().getFullYear();

    // Same origin as the main web app, so the Supabase session Google's
    // redirect just delivered here (via the URL hash/code, parsed
    // automatically by supabase-js's detectSessionInUrl) is already sitting
    // in this origin's localStorage - no need to re-parse or re-exchange it
    // on this page. Continuing into the web app below just picks it up.
    var WEB_APP_URL = 'https://gtt-web.nxnx.tech/';
    var APP_SCHEME_URL = 'ghanatrotrotransit://';

    var isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    var statusEl = document.getElementById('status-text');
    var btn = document.getElementById('continue-btn');

    function goToWebApp() {
        window.location.href = WEB_APP_URL;
    }

    // Tries the installed app first (mobile only); if nothing takes the
    // handoff within the timeout - no app installed, or the OS blocked the
    // scheme - falls back to the web app so the person is never stuck here.
    function openApp() {
        if (!isMobile) {
            goToWebApp();
            return;
        }

        btn.disabled = true;
        statusEl.textContent = 'Opening the app…';

        var handedOff = false;
        function onVisibilityChange() {
            if (document.hidden) handedOff = true;
        }
        document.addEventListener('visibilitychange', onVisibilityChange);

        var fallbackTimer = setTimeout(function () {
            document.removeEventListener('visibilitychange', onVisibilityChange);
            if (!handedOff && !document.hidden) {
                statusEl.textContent = 'App not found, continuing in your browser…';
                goToWebApp();
            }
        }, 1500);

        window.location.href = APP_SCHEME_URL;
    }

    btn.textContent = isMobile ? 'Open App' : 'Continue to Ghana Trotro Transit';
    btn.addEventListener('click', openApp);

    // Auto-attempt on load too, so most people never have to tap anything -
    // the button above is just there as a fallback if the browser blocks
    // the automatic redirect.
    openApp();
</script>
</body>
</html>
